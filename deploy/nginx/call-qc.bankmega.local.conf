server {
    listen      443 ssl ;
    listen      [::]:443 ssl ;
    server_name  call-qc.bankmega.local;
    server_tokens off;
    client_max_body_size 150M;
    ssl_certificate "/etc/ssl/bankmegalocal/bankmegalocal.crt";
    ssl_certificate_key "/etc/ssl/bankmegalocal/bankmegalocal.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    location /health {
        return 200 'Hello from app call qc';
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    # --- API dashboard / tickets (App C :8008) ---
    location /me {
        proxy_pass http://localhost:8008;
    }
    location /auth/login {
        proxy_pass http://localhost:8008;
    }
    location /auth/logout {
        proxy_pass http://localhost:8008;
    }
    location /tickets {
        proxy_pass http://localhost:8008;
    }
    location /api/refresh {
        proxy_pass http://localhost:8008;
    }
    location /qc-result-logs {
        proxy_pass http://localhost:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- /tickets-daily (App C :8008) — same-origin, tapi tetap kirim X-API-Key ---
    location /tickets-daily {
        proxy_pass http://localhost:8008;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- Detail / file PDF (App C :8010) ---
    location ~ ^/tickets/[^/]+$ {
        proxy_pass http://localhost:8010;
    }
    location /api/download {
        proxy_pass http://localhost:8010;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/view-streams/ {
        proxy_pass http://localhost:8010;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # --- File audio (MinIO) ---
    location /voice-to-text-dm/ {
        proxy_pass https://cdn.bankmega.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }
    # --- App B :4000 — SEMUA endpoint via prefix /api-b/ (VITE_API_URL=/api-b) ---
    # proxy_pass diakhiri "/" -> prefix di-strip:
    #   /api-b/auth/login  ->  http://localhost:4000/auth/login
    location /api-b/ {
        proxy_pass http://localhost:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }
    # --- Backend :8000 — SEMUA endpoint via prefix /api-a/ (VITE_API_BASE=/api-a) ---
    #   /api-a/xxx  ->  http://localhost:8000/xxx
    location /api-a/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
    # --- Frontend call-qc (:4006) ---
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:4006;
        proxy_intercept_errors on;
    }
    location ~ /\.ht {
        deny all;
    }
    location ~ readme.txt {
        deny all;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name  call-qc.bankmega.local;
    server_tokens off;
    return 301 https://$host$request_uri;
}
