server {
    listen 4006;
    root /usr/share/nginx/html;
    client_max_body_size 150M;

    # --- Akses langsung lewat IP (http://10.158.32.26:4006) ------------------
    #
    # Bundle memanggil API dengan prefix RELATIF (`/api-b`, `/api-a`, lihat
    # VITE_API_URL di Dockerfile). Lewat domain, prefix itu diurai oleh nginx
    # host (/etc/nginx/sites-enabled/default) sebelum request sampai ke sini, jadi
    # blok di bawah tidak pernah tersentuh. Tanpa blok ini, membuka port 4006
    # langsung membuat POST /api-b/auth/login dijawab 405 oleh nginx statis — dan
    # GET-nya diam-diam dibalas index.html. Rutenya disamakan dengan nginx host.
    #
    # Disadari (25 September 2026, atas permintaan user): jalur ini HTTP polos,
    # tanpa TLS milik domain — kredensial & token lewat tanpa enkripsi.
    location /api-b/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api-a/ {
        proxy_pass http://10.158.32.26:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # PDF transkrip (UploadAudioView: VITE_PDF_API_BASE kosong -> path relatif).
    location /api/download {
        proxy_pass http://10.158.32.26:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/view-streams/ {
        proxy_pass http://10.158.32.26:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve ES module workers/scripts (.mjs, e.g. the pdf.js worker) with a JS
    # MIME type — browsers reject module workers served as application/octet-stream.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # index.html TIDAK boleh disimpan browser. Isinya cuma penunjuk ke bundle
    # ber-hash, jadi browser yang menahannya akan terus memuat bundle LAMA setelah
    # deploy. Itu bukan hipotesis: 28 Agustus 2026, tujuh jam setelah build baru
    # terpasang, empat browser berbeda masih menjalankan bundle pra-perbaikan dan
    # memanggil `/tickets-daily` (jalur langsung ke App C, tanpa gate campaign)
    # alih-alih `/api-b/tickets_daily` — nol permintaan ke jalur yang baru seharian.
    # Tanpa Cache-Control apa pun, nginx hanya mengirim ETag/Last-Modified dan
    # browser bebas menebak masa berlakunya sendiri.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Bundle ber-hash boleh disimpan selamanya — nama berkasnya berubah tiap build.
    #
    # `=404`, BUKAN fallback ke /index.html: fallback membuat chunk yang sudah tidak
    # ada dibalas HTML ber-status 200, sehingga klien basi tampak "jalan" padahal
    # modulnya gagal dimuat. Deploy yang basi harus gagal terang-terangan.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # gzip_vary/min_length/svg: port monolit 17 September 2026 (improvement.md item 1.4).
    # Cache-Control aset & index.html sudah ada di atas sejak 28 Agustus 2026.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
